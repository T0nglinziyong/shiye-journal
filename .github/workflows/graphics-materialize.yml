name: Materialize verified unified graphics
on:
  push:
    branches: [refactor/unified-graphic-entry-20261022]
    paths: [.github/workflows/graphics-materialize.yml]
permissions:
  contents: write
jobs:
  source:
    if: github.ref == 'refs/heads/refactor/unified-graphic-entry-20261022'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply hash-verified source delta without workflow changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 9d955e13ffff0f785d0eb5a6212602dc55900f05^{tree})" = 7e52f69101f58019c27255de2254ef7b09e9d5c1
          python3 - <<'PY'
          import pathlib,hashlib,base64,lzma,json,shutil
          parts=sorted(pathlib.Path('.graphics-transfer').glob('part-*.b64'))
          assert len(parts)==3
          payload=base64.b64decode(''.join(p.read_text() for p in parts),validate=True)
          assert hashlib.sha256(payload).hexdigest()=='49a87b4c76836e9688307363a81c173957ec1facf58108e403f8d0a53bdb85af'
          changes=json.loads(lzma.decompress(payload))
          assert len(changes)==33
          for change in changes:
              path=pathlib.Path(change['path'])
              assert not path.is_absolute() and '..' not in path.parts and not path.is_symlink()
              assert str(path).startswith(('src/','tests/','scripts/','docs/','creation-contract/')) or str(path)=='README.md'
              old=path.read_text() if path.exists() else ''
              assert hashlib.sha256(old.encode()).hexdigest()==change['before'],str(path)
              new=old
              for start,end,text in reversed(change['edits']):
                  assert 0<=start<=end<=len(old)
                  new=new[:start]+text+new[end:]
              assert hashlib.sha256(new.encode()).hexdigest()==change['after'],str(path)
              if change['delete']:
                  assert not new
                  path.unlink()
              else:
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_text(new)
          shutil.rmtree('.graphics-transfer')
          PY
          git add -A
          git diff --cached --check
          test -z "$(git diff --cached --name-only -- .github)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: one graphics command and compositional embellishment guidance'
          git push origin HEAD:refs/heads/refactor/unified-graphic-entry-20261022
