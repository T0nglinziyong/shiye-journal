name: Instance-first recognition tests

on:
  push:
    branches: [experiment/instance-first-recognition-20261007]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instance-first-recognition-tests
  cancel-in-progress: true

jobs:
  vision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run recognition unit tests
        run: node --test tests/vision-engine.test.js tests/recognition-quality.test.js tests/recognition-fusion.test.js
