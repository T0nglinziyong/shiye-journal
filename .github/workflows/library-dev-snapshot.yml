name: Library development snapshot
on:
  push:
    branches: [feat/library-taxonomy-covers-20261022]
    paths: [.github/workflows/library-dev-snapshot.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: |
          mkdir -p /tmp/library-workspace
          git rev-parse HEAD > /tmp/library-workspace/revision.txt
          git archive HEAD | gzip > /tmp/library-workspace/source.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: library-workspace
          path: /tmp/library-workspace
          retention-days: 1
