name: Craft v2 isolated integration

on:
  push:
    branches: [codex/ai-material-craft-v2-20261003]

permissions:
  contents: write

concurrency:
  group: craft-v2-bootstrap
  cancel-in-progress: false

jobs:
  integrate:
    if: github.ref == 'refs/heads/codex/ai-material-craft-v2-20261003'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply guarded source integration
        run: node scripts/apply-craft-v2.mjs
      - name: Rebuild shared offline validator before integration tests
        run: npm run build
      - name: Unit and application smoke tests
        shell: bash
        run: |
          set -euo pipefail
          npm test | tee /tmp/craft-v2-unit.log
          npm run test:ui | tee /tmp/craft-v2-ui.log
          python3 -m unittest discover -s tests -p 'test_*.py'
          git diff --check
      - name: Record actual result and commit integrated sources
        shell: bash
        env:
          TARGET_BRANCH: codex/ai-material-craft-v2-20261003
        run: |
          set -euo pipefail
          mkdir -p docs/ai-craft-v2
          {
            echo '# Craft v2 implementation verification'
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Starting branch commit: $GITHUB_SHA"
            echo "Node: $(node --version)"
            echo
            echo 'The guarded source transformation ran before tests. The following commands completed successfully:'
            echo '- npm run build'
            echo '- npm test'
            echo '- npm run test:ui'
            echo "- python3 -m unittest discover -s tests -p 'test_*.py'"
            echo '- git diff --check'
            echo
            echo 'Unit summary:'
            tail -15 /tmp/craft-v2-unit.log
            echo
            echo 'These are synthetic/unit and Happy DOM smoke checks, not physical iPad/Safari or paid-model quality acceptance.'
            echo 'No user database, private images, keys, DNS, or deployment configuration was changed.'
          } > docs/ai-craft-v2/IMPLEMENTATION_RESULTS.md
          git add src/creative-contract.js src/creative.js src/offline-creation.js src/creative-layering-guide.js src/creative-quality.js src/matching-view.js src/app.js src/generated/offline-validate-source.js tests/fixtures/craft-v2-legacy-schema-hashes.json docs/ai-craft-v2/IMPLEMENTATION_RESULTS.md
          git rm scripts/apply-craft-v2.mjs .github/workflows/craft-v2-bootstrap.yml
          git diff --cached --check
          git diff --cached --stat
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(craft): integrate editable edge operations source footprints and rotated relations'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
