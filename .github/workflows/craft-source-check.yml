name: Craft isolated source check
on:
  push:
    branches: [codex/craft-v2-cache-selection-20261003]
    paths: ['.github/workflows/craft-source-check.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Export source and non-font test dependencies, not credentials or user media
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/craft-source
          git ls-files -z src tests scripts server api docs .github '*.md' package.json package-lock.json index.html vite.config.js vercel.json .vercelignore public/sw.js | tar --null -T - --exclude='*.woff*' --exclude='*.ttf' --exclude='*.otf' --exclude='*.png' --exclude='*.jpg' --exclude='*.jpeg' --exclude='*.pdf' --exclude='*.zip' -czf /tmp/craft-source/source.tgz
          tar -czf /tmp/craft-source/test-dependencies.tgz --exclude='*.woff*' --exclude='*.ttf' --exclude='*.otf' --exclude='node_modules/@fontsource' --exclude='node_modules/@huggingface' --exclude='node_modules/onnxruntime-*' --exclude='node_modules/@img' --exclude='node_modules/sharp' --exclude='*.wasm' node_modules
          echo "$GITHUB_SHA" > /tmp/craft-source/commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: craft-isolated-source
          path: /tmp/craft-source/
          retention-days: 1
