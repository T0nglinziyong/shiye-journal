<!doctype html>
<html lang="zh-CN"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#fffefa"><meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icon-192.png">
  <title>拾页 · 本地创作</title><meta name="description" content="本地保存真实手账素材与可编辑作品">
</head><body>
  <div id="app" hidden>
    <header class="topbar"><div class="brand"><b>♧</b><div><strong>拾页</strong><small>COLLECT. COMPOSE.</small></div></div><nav class="main-nav" aria-label="主导航">
      <button data-route="library"><span aria-hidden="true">▣</span> 素材</button><button data-route="matching"><span aria-hidden="true">✦</span> 搭配</button><button data-route="works"><span aria-hidden="true">▤</span> 作品</button>
    </nav><div class="top-actions"><button type="button" id="top-basket" aria-label="本次创作">本次创作 <span id="basket-count">0</span></button><button type="button" id="top-settings" aria-label="设置">⚙</button><button type="button" id="sync-indicator" class="sync-indicator" hidden><span class="sync-indicator-symbol" aria-hidden="true"></span><span class="sync-indicator-label" aria-live="polite">正在核对</span></button><span id="save-state" class="save-state">本机存储</span></div></header>
    <main id="view" aria-live="polite"><section class="empty"><strong>正在打开拾页…</strong><p>正在验证登录并读取当前账号的本机缓存。</p></section></main>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>
  <dialog id="modal"><div class="modal-shell"><button type="button" class="modal-close" aria-label="关闭">×</button><div id="modal-body"></div></div></dialog>
  <input id="file-input" type="file" accept="image/*" multiple hidden><input id="work-file-input" type="file" accept="image/*,.json,.zip" hidden><input id="creation-result-input" type="file" hidden><input id="snapshot-file-input" type="file" accept="image/png,image/jpeg,image/webp" hidden><input id="backup-input" type="file" accept=".shiyepwa,.json" hidden><input id="emergency-input" type="file" accept=".shiyerecovery,.json" hidden>
  <script type="module" src="/src/app.js"></script>
</body></html>
