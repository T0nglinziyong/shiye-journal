name: Verify craft dependency lock
on:
  push:
    branches: [codex/craft-v2-cache-selection-20261003]
    paths: ['.github/workflows/bootstrap-craft-libs.yml']
permissions:
  contents: write
jobs:
  lock:
    if: github.ref == 'refs/heads/codex/craft-v2-cache-selection-20261003'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Resolve only the explicitly pinned additions
        shell: bash
        run: |
          set -euo pipefail
          cp package-lock.json "$RUNNER_TEMP/prior-package-lock.json"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const prior=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/prior-package-lock.json','utf8'));
          const next=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const entries=Object.entries(next.packages);
          for(const [path,pkg] of Object.entries(prior.packages)){
            if(!path)continue;
            const name=path.split('node_modules/').at(-1);
            const kept=entries.some(([p,v])=>p.split('node_modules/').at(-1)===name&&v.version===pkg.version&&v.integrity===pkg.integrity);
            if(!kept)throw Error('Existing dependency changed: '+path+'@'+pkg.version);
          }
          const expected={'@noble/hashes':'2.0.1','opentype.js':'2.0.0','polygon-clipping':'0.15.7'};
          for(const [name,version] of Object.entries(expected)){
            const pkg=next.packages['node_modules/'+name];
            if(pkg?.version!==version||!pkg.integrity||pkg.hasInstallScript)throw Error('Unexpected added dependency: '+name);
          }
          console.log('Existing package versions/integrities preserved; three pinned additions verified.');
          NODE
      - run: npm ci
      - name: Verify lock and current application
        run: npm test && npm run test:ui && python3 -m unittest discover -s tests -p 'test_*.py' && git diff --check
      - name: Commit only the verified lock and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=codex/craft-v2-cache-selection-20261003
          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git add package-lock.json src/generated/offline-validate-source.js
          git rm .github/workflows/bootstrap-craft-libs.yml
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(craft): lock verified topology and glyph dependencies'
          git push origin "HEAD:refs/heads/$BRANCH"
