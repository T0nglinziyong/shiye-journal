name: Materialize verified craft source
on:
  push:
    branches: [feat/craft-detail-type-effects-20261022]
    paths: [.github/workflows/craft-materialize.yml]
permissions:
  contents: write
jobs:
  source:
    if: github.ref == 'refs/heads/feat/craft-detail-type-effects-20261022'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and publish code only; workflow changes use authorized connector
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,lzma,pathlib,shutil
          parts=sorted(pathlib.Path('.craft-transfer').glob('part-*.b64'))
          assert len(parts)==5
          payload=base64.b64decode(''.join(p.read_text() for p in parts),validate=True)
          assert hashlib.sha256(payload).hexdigest()=='5dfeea9fd650212b86d5954fe1d0154475964244b57e45219a1b0511354baad2'
          changes=json.loads(lzma.decompress(payload))
          assert len(changes)==38
          for change in changes:
              path=pathlib.Path(change['path'])
              assert not path.is_absolute() and '..' not in path.parts
              if str(path).startswith('.github/'): continue
              assert str(path).startswith(('src/','tests/','scripts/','docs/','creation-contract/')) or str(path)=='README.md'
              assert not path.is_symlink()
              old=path.read_text() if path.exists() else ''
              assert hashlib.sha256(old.encode()).hexdigest()==change['before'],str(path)
              new=old
              for start,end,text in reversed(change['edits']):
                  assert 0<=start<=end<=len(old)
                  new=new[:start]+text+new[end:]
              assert hashlib.sha256(new.encode()).hexdigest()==change['after'],str(path)
              if change['status']=='D':
                  assert new==''
                  path.unlink()
              else:
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_text(new)
          shutil.rmtree('.craft-transfer')
          PY
          git add -A
          git diff --cached --check
          test -z "$(git diff --cached --name-only -- .github)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: richer journal composition and editable artistic typography'
          git push origin HEAD:refs/heads/feat/craft-detail-type-effects-20261022
