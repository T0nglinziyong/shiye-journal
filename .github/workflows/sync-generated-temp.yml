name: Sync generated runtime temp

on:
  push:
    branches:
      - ui/refine-matching-library-works-20261004

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ui/refine-matching-library-works-20261004
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/build-offline-runtime.mjs
      - name: Commit generated runtime
        run: |
          if git diff --quiet -- src/generated/offline-validate-source.js src/generated/offline-browser-source.js src/generated/offline-glyph-source.js; then
            echo "Generated runtime already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/generated/offline-validate-source.js src/generated/offline-browser-source.js src/generated/offline-glyph-source.js
          git commit -m "chore: sync generated offline runtime [skip ci]"
          git push origin HEAD:ui/refine-matching-library-works-20261004
