name: Visual loop source snapshot
on:
  push:
    branches: [refine/visual-creation-loop-20261022]
    paths: [.github/workflows/visual-loop-snapshot.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p /tmp/visual-source
          git rev-parse HEAD > /tmp/visual-source/revision.txt
          git rev-parse HEAD^{tree} > /tmp/visual-source/tree.txt
          git archive HEAD | gzip > /tmp/visual-source/source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: visual-source
          path: /tmp/visual-source
          retention-days: 1
