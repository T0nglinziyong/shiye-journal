<!doctype html>
<html lang="zh-CN"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#fffefa"><meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <title>拾页 · 数字手帐</title><meta name="description" content="保存真实手帐素材，创作可编辑的数字手帐">
  <style>
    #auth-root[hidden]{display:none!important}
    #auth-root:has(.boot-card){min-height:100dvh;display:grid;place-items:center;padding:24px;background:#f7f7f2;color:#263d34;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
    .boot-card{width:min(100%,420px);padding:28px;border:1px solid #dbe3d9;border-radius:18px;background:#fffefa}
    .boot-card h1{margin:0 0 18px;font-size:28px}.boot-card p{margin:0;color:#617267}
    #filing-footer{text-align:center;padding:16px 16px calc(28px + env(safe-area-inset-bottom));color:#78867a;font-size:12px}
    #filing-footer a{color:inherit;text-decoration:none}
    #filing-footer a:hover,#filing-footer a:focus-visible{text-decoration:underline}
    @media(max-width:699px){#filing-footer{padding-bottom:calc(96px + env(safe-area-inset-bottom))}}
  </style>
</head><body>
  <div id="auth-root"><main class="boot-card" role="status"><h1>拾页</h1><p>正在启动…</p></main></div>
  <div id="app" hidden></div>
  <footer id="filing-footer"><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">京ICP备2026071775号-1</a></footer>
  <script type="module" src="/src/app.js"></script>
</body></html>
