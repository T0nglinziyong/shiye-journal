name: Three modes development snapshot
on:
  push:
    branches: [feat/creation-three-modes-graphics-20261023]
    paths: [.github/workflows/three-modes-workspace.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: |
          mkdir -p /tmp/three-modes-source
          git rev-parse HEAD > /tmp/three-modes-source/revision.txt
          git archive HEAD | gzip > /tmp/three-modes-source/source.tar.gz
          cd /tmp/three-modes-source && sha256sum source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: three-modes-source
          path: /tmp/three-modes-source
          retention-days: 2
