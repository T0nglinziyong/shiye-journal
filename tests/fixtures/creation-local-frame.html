<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Creation local frame regression</title>
<style>body{margin:16px;font:16px system-ui;background:#eee}canvas{width:min(100%,500px);height:auto;display:block}pre{white-space:pre-wrap;max-height:180px;overflow:auto}#preview{display:flex;gap:16px;flex-wrap:wrap}</style>
<h1>局部组合真实渲染检查</h1><pre id="result">running</pre><div id="preview"></div>
<script type="module">
import {draft} from '/src/domain.js';
import {createCreationDocument} from '/src/creation-document.js';
import {applyCreationTransaction,creationSceneRevision} from '/src/creation-transaction.js';
import {inspectCreationDocument} from '/src/creation-inspection.js';
import {renderSceneCanvas} from '/src/scene-renderer.js';
try {
 const asset={id:'red',title:'合成红纸',kind:'paper',physicalWidthMM:30,physicalHeightMM:20,supply:{quantity:1}};
 const original=await createCreationDocument({draft:draft(),assets:[asset],aliases:{m1:'red'},processing:'保留完整'});
 const commands={protocolVersion:2,transactionId:'browser-local-frame',baseSceneRevision:creationSceneRevision(original),operations:[
  {op:'group.compose',id:'outer',place:{reference:'page',at:[60,70],unit:'mm',rotationDeg:30},layoutBox:{width:90,height:90,unit:'mm'},children:[
   {op:'group.compose',id:'inner',place:{reference:'parent',at:[.5,.5],unit:'ratio',rotationDeg:-30},layoutBox:{width:40,height:30,unit:'mm'},children:[
    {op:'material.add',id:'paper',asset:'m1',place:{reference:'parent',at:[.5,.5],unit:'ratio'}}]}]}]};
 const committed=applyCreationTransaction(original,commands,[asset]);
 const replay=applyCreationTransaction(committed.document,commands,[asset]);
 if(!replay.result.replayed)throw Error('重复提交未识别');
 const red=document.createElement('canvas');red.width=red.height=10;const brush=red.getContext('2d');brush.fillStyle='#ff0000';brush.fillRect(0,0,10,10);
 const samples=[];
 for(const isolatedOuter of [false,true]){
  const doc=structuredClone(committed.document),outer=doc.page.layers[0],inner=outer.children[0];
  inner.opacity=.8;inner.vectorMask={outer:[[0,0],[1,0],[1,1],[0,1]],holes:[]};if(isolatedOuter)outer.opacity=.9;
  const {canvas}=await renderSceneCanvas(doc.page,{loadMaterialImage:()=>red,waitForFonts:false});
  const center=inspectCreationDocument(doc).layers.find(n=>n.alias==='paper').world.centerMm,s=doc.page.canvas.height/doc.page.physicalPageHeightMM;
  for(const dx of [-10,0,10]){
   const pixel=[...canvas.getContext('2d').getImageData(Math.round((center[0]+dx)*s),Math.round(center[1]*s),1,1).data];
   if(!(pixel[0]>200&&pixel[1]<100&&pixel[2]<100))throw Error('错误像素 '+JSON.stringify({isolatedOuter,dx,pixel}));
   samples.push({isolatedOuter,dx,pixel});
  }
  document.querySelector('#preview').append(canvas);
 }
 document.querySelector('#result').textContent=JSON.stringify({status:'passed',samples,protocol:2,replay:true},null,2);
 document.body.dataset.result='passed';
}catch(error){document.querySelector('#result').textContent=error.stack;document.body.dataset.result='failed';}
</script>
