name: Materialize verified editor kernel
on:
  push:
    branches: [refactor/shared-editor-kernel-20261022]
    paths: [.github/workflows/editor-materialize.yml]
permissions:
  contents: write
concurrency:
  group: editor-kernel-materialize
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'T0nglinziyong/shiye-journal'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Verify every source delta and exact final tree, then commit on feature branch
        run: python3 .editor-transfer/apply.py
