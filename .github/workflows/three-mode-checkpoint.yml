name: Verified three-mode source checkpoint
on:
  push:
    branches: [feat/three-mode-graphics-runtime-20261023]
    paths: [.github/workflows/three-mode-checkpoint.yml]
permissions:
  contents: write
jobs:
  source:
    if: github.ref == 'refs/heads/feat/three-mode-graphics-runtime-20261023'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed release corrections with exact hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,lzma,pathlib
          payload=base64.b64decode(pathlib.Path('.release-fix.b64').read_text(),validate=True)
          assert hashlib.sha256(payload).hexdigest()=='5065625424b34c37adbf201c315bdaa1f4e4e3a36ab24499a489e96a4eec3a36'
          changes=json.loads(lzma.decompress(payload));assert len(changes)==9
          pending=[]
          for change in changes:
              path=pathlib.Path(change['path'])
              assert not path.is_absolute() and '..' not in path.parts and not path.is_symlink()
              assert str(path).startswith(('src/','tests/','docs/')) or str(path)=='README.md'
              old=path.read_text() if path.exists() else ''
              assert hashlib.sha256(old.encode()).hexdigest()==change['before'],str(path)
              new=old
              for start,end,text in reversed(change['edits']):
                  assert 0<=start<=end<=len(old)
                  new=new[:start]+text+new[end:]
              assert hashlib.sha256(new.encode()).hexdigest()==change['after'],str(path)
              pending.append((path,new))
          for path,new in pending:
              path.parent.mkdir(parents=True,exist_ok=True);path.write_text(new)
          pathlib.Path('.release-fix.b64').unlink()
          PY
          git add -A
          git diff --cached --check
          test -z "$(git diff --cached --name-only -- .github)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: reject empty reconstructions and release all graphics worker resources'
          git push origin HEAD:refs/heads/feat/three-mode-graphics-runtime-20261023
