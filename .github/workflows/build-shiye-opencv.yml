name: Build Shiye OpenCV

on:
  push:
    branches: [recognition-official-engines]
    paths:
      - 'opencv/shiye-opencv-js.config.py'
      - '.github/workflows/build-shiye-opencv.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-shiye-opencv
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: recognition-official-engines
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake python3
      - name: Checkout Emscripten SDK
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: emscripten-core/emsdk
          path: .opencv-build/emsdk
      - name: Cache Emscripten SDK
        uses: actions/cache@v4
        with:
          path: |
            .opencv-build/emsdk/upstream
            .opencv-build/emsdk/node
            .opencv-build/emsdk/.emscripten
          key: shiye-emsdk-4.0.20
      - name: Install Emscripten
        shell: bash
        run: |
          set -euo pipefail
          cd .opencv-build/emsdk
          ./emsdk install 4.0.20
          ./emsdk activate 4.0.20
      - name: Checkout OpenCV
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: opencv/opencv
          ref: 5.0.0
          path: .opencv-build/opencv
      - name: Build minimal OpenCV.js
        shell: bash
        run: |
          set -euo pipefail
          source .opencv-build/emsdk/emsdk_env.sh
          emcmake python3 .opencv-build/opencv/platforms/js/build_js.py .opencv-build/build \
            --opencv_dir=.opencv-build/opencv \
            --disable_single_file \
            --simd \
            --config="$GITHUB_WORKSPACE/opencv/shiye-opencv-js.config.py" \
            --cmake_option="-DCMAKE_CXX_STANDARD=17" \
            --cmake_option="-DBUILD_opencv_dnn=OFF" \
            --cmake_option="-DBUILD_opencv_features=OFF" \
            --cmake_option="-DBUILD_opencv_flann=OFF" \
            --cmake_option="-DBUILD_opencv_objdetect=OFF" \
            --cmake_option="-DBUILD_opencv_video=OFF" \
            --cmake_option="-DBUILD_opencv_3d=OFF" \
            --cmake_option="-DBUILD_opencv_calib=OFF" \
            --cmake_option="-DBUILD_opencv_geometry=OFF" \
            --cmake_option="-DBUILD_opencv_ptcloud=OFF" \
            --cmake_option="-DBUILD_opencv_stereo=OFF" \
            --cmake_option="-DBUILD_opencv_photo=ON"
          ls -lh .opencv-build/build/bin
      - name: Stage browser assets
        shell: bash
        run: |
          set -euo pipefail
          DEST=public/vendor/opencv-shiye
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp .opencv-build/build/bin/opencv.js "$DEST/opencv.js"
          find .opencv-build/build/bin -maxdepth 1 -type f -name '*.wasm' -exec cp {} "$DEST/" \;
          cp .opencv-build/opencv/LICENSE "$DEST/LICENSE.txt"
          python3 - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path('public/vendor/opencv-shiye')
          files=[]
          for p in sorted(root.iterdir()):
              if p.is_file():
                  data=p.read_bytes()
                  files.append({'name':p.name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          (root/'manifest.json').write_text(json.dumps({
              'opencv':'5.0.0',
              'emscripten':'4.0.20',
              'modules':['core','imgproc','photo'],
              'simd':True,
              'files':files,
          },indent=2)+'\n')
          print(json.dumps(files,indent=2))
          PY
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: shiye-opencv-minimal
          path: public/vendor/opencv-shiye/
      - name: Commit generated OpenCV assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/vendor/opencv-shiye
          if git diff --cached --quiet; then
            echo "Minimal OpenCV assets are already current."
            exit 0
          fi
          git commit -m "build(recognition): vendor minimal OpenCV.js runtime"
          git push origin HEAD:recognition-official-engines
