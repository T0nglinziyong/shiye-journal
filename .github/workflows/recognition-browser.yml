name: Recognition browser regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/browser-contour-engines.js'
      - 'src/recognition-*.js'
      - 'src/opencv-worker.js'
      - 'src/vision-runtime.js'
      - 'tests/browser-contour-engines.test.js'
      - 'tests/recognition-engine-browser.mjs'
      - 'tests/recognition-profiles.test.js'
      - '.github/workflows/recognition-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recognition-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install pinned browser driver
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/shiye-browser" --no-save --package-lock=false agent-browser@0.38.2
          BROWSER_BIN="$RUNNER_TEMP/shiye-browser/node_modules/.bin/agent-browser"
          "$BROWSER_BIN" install --with-deps
          echo "SHIYE_BROWSER_BIN=$BROWSER_BIN" >> "$GITHUB_ENV"
      - name: Run isolated contour-engine contract
        run: node --test tests/browser-contour-engines.contract.mjs tests/recognition-aperture.contract.mjs
      - name: Enforce isolated fast-path latency
        env:
          SHIYE_ISOLATED_RECOGNITION: '1'
        run: node --test --test-name-pattern="fast shared-pass recognizer" tests/vision-engine.test.js
      - name: Build actual sources
        run: npm run build
      - name: Run recognition engines in Chromium
        shell: bash
        env:
          SHIYE_TEST_URL: http://127.0.0.1:5192
          SHIYE_RECOGNITION_REPORT: /tmp/shiye-recognition/report.json
        run: |
          set -euo pipefail
          npm run dev -- --port 5192 --strictPort > /tmp/shiye-recognition-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5192/ >/dev/null; then break; fi
            sleep 1
          done
          node tests/recognition-engine-browser.mjs
      - name: Retain recognition benchmark
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recognition-browser-${{ github.run_id }}
          path: /tmp/shiye-recognition/
          if-no-files-found: warn
          retention-days: 7
