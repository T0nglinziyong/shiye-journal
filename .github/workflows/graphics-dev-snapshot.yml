name: Graphics development snapshot
on:
  push:
    branches: [refactor/unified-graphic-entry-20261022]
    paths: [.github/workflows/graphics-dev-snapshot.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive tracked source only
        run: |
          mkdir -p /tmp/graphics-source
          git archive HEAD | gzip > /tmp/graphics-source/source.tar.gz
          git rev-parse HEAD > /tmp/graphics-source/revision.txt
          git rev-parse HEAD^{tree} > /tmp/graphics-source/tree.txt
          cd /tmp/graphics-source && sha256sum source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: graphics-source
          path: /tmp/graphics-source
          retention-days: 1
