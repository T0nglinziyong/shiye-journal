name: Publish verified creation refactor
on:
  push:
    branches: [refactor/creation-single-contract-20261022]
    paths: [.creation-transfer/**, .github/workflows/creation-materialize.yml]
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'T0nglinziyong/shiye-journal'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: refactor/creation-single-contract-20261022
      - name: Apply exact locally tested source delta with per-file verification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, lzma, subprocess
          from pathlib import Path
          chunks = [Path(f'.creation-transfer/part-{i}.txt').read_text() for i in range(7)]
          packed = base64.b64decode(''.join(chunks), validate=True)
          assert hashlib.sha256(packed).hexdigest() == '0fd7ad2cd5c47093bea71672f022e93f6ba7e03131359a25c91c6fc20de48666'
          rows = json.loads(lzma.decompress(packed))
          assert len(rows) == 27
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() if data is not None else None
          for row in rows:
              p = Path(row['path'])
              assert not p.is_absolute() and '..' not in p.parts and not p.parts[0].startswith('.')
              before = p.read_bytes() if p.is_file() else None
              assert blob(before) == row['base'], str(p) + ': changed baseline'
              if row['result'] is None:
                  p.unlink()
              else:
                  lines = (before or b'').decode('utf-8').splitlines(keepends=True)
                  for start, count, inserted in reversed(row['edits']):
                      lines[start:start + count] = inserted.splitlines(keepends=True)
                  after = ''.join(lines).encode('utf-8')
                  assert blob(after) == row['result'], str(p) + ': result mismatch'
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_bytes(after)
              subprocess.run(['git', 'add', '--', str(p)], check=True)
          PY
          git rm -r .creation-transfer
          git update-index --force-remove .github/workflows/creation-dev-snapshot.yml .github/workflows/creation-materialize.yml
          test "$(git write-tree)" = '8dd07b055b6ddc5a066df17017e8b06c9259872b'
          git add .github/workflows/creation-dev-snapshot.yml .github/workflows/creation-materialize.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: canonical Scene edits and one complete creation command language'
          git push origin HEAD:refactor/creation-single-contract-20261022
