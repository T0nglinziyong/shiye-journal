name: Finalize authoritative Scene preview assertions
on:
  push:
    branches: [refactor/shared-editor-kernel-20261022]
    paths: [.github/workflows/editor-finalize-test.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,subprocess,os
          branch='refactor/shared-editor-kernel-20261022'
          assert os.environ['GITHUB_REF_NAME']==branch
          p=Path('tests/fabric-stage-browser.mjs');s=p.read_text()
          assert hashlib.sha256(s.encode()).hexdigest()=='76ce681ed99ef6d4f98ffd8130b5e3970e23de436d22c9e3aa92f04dfcb6989f'
          s=s.replace("const beforeCancel=await evaluate('JSON.stringify(window.__fabricFixture.draft.layers[0].children[0])');", "const beforeCancel=await evaluate('JSON.stringify(window.__fabricFixture.draft.layers[0].children[0])');\n  await sleep(40);const beforeCancelPixels=await shapePixels();\n  const beforeCancelCommits=await evaluate('window.__fabricFixture.commits.length');")
          s=s.replace("assert.notEqual(await evaluate('JSON.stringify(window.__fabricFixture.draft.layers[0].children[0])'),\n    beforeCancel,'Lasso drag should preview a Scene change');", "assert.equal(await evaluate('JSON.stringify(window.__fabricFixture.draft.layers[0].children[0])'),\n    beforeCancel,'Lasso drag previews must not modify the authoritative Scene');\n  await sleep(40);assert.notEqual(await shapePixels(),beforeCancelPixels,'Lasso drag must still repaint the moving content');")
          s=s.replace("beforeCancel,'Cancelled lasso gesture must restore the original Scene node');", "beforeCancel,'Cancelled lasso gesture must preserve the original Scene node');\n  assert.equal(await evaluate('window.__fabricFixture.commits.length'),beforeCancelCommits,'Cancelled preview must not commit a change');\n  await sleep(40);assert.equal(await shapePixels(),beforeCancelPixels,'Cancelled preview must restore visible content');")
          assert hashlib.sha256(s.encode()).hexdigest()=='0eb46ea8cfd920670530ed133093c7ea757bece1f9ad17d9f90bc3bc3db5c2ea'
          p.write_text(s)
          p=Path('docs/shared-editor-kernel.md');s=p.read_text()
          assert hashlib.sha256(s.encode()).hexdigest()=='8eee35d967bbb75f8e67c529dfb23f7a664914c8a7bbde90c553341e6b983db3'
          s=s.replace('失败仍保留会话供检查。','失败仍保留会话供检查。步骤撤销/重做同时恢复裁片、余料、材料账本和收据，不仅恢复图层。')
          s=s.replace('`creation-node-update` 不再拥有','`domain` 的素材、文字、图形构造函数直接返回带明确 type 的节点；共享插入拒绝缺失类型，不再依赖旧集合视图补全类型。\n\n`creation-node-update` 不再拥有')
          assert hashlib.sha256(s.encode()).hexdigest()=='925ab40970d8610a1aa0ed736e34a75108f8397e3b562ed40580aac4b106aa30'
          p.write_text(s)
          Path('.github/workflows/editor-finalize-test.yml').unlink()
          subprocess.run(['git','add','-A'],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree=='c8d40c24b00a40d8583aaba2c31240a8807dace5',tree
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','test: assert lasso preview pixels without premature Scene commits'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+branch],check=True)
          PY
