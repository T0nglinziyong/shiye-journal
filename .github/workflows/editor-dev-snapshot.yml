name: Editor kernel source snapshot
on:
  push:
    branches: [refactor/shared-editor-kernel-20261022]
    paths: [.github/workflows/editor-dev-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Pack tracked source without credentials or font binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/editor-source"
          git ls-files -z | python3 -c 'import sys; paths=sys.stdin.buffer.read().split(b"\0"); sys.stdout.buffer.write(b"\0".join(p for p in paths if p and not p.lower().endswith((b".ttf",b".otf",b".woff",b".woff2",b".ttc")))+b"\0")' | tar --null -T - -czf "$RUNNER_TEMP/editor-source/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/editor-source/revision.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/editor-source/tree.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: editor-kernel-source
          path: ${{ runner.temp }}/editor-source/
          retention-days: 1
