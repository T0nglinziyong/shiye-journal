name: Rebuild current generated runtimes
on:
  push:
    branches: [refactor/compact-gpt-task-package]
    paths: ['.github/workflows/rebuild-current-generated.yml']
permissions:
  contents: write
concurrency:
  group: rebuild-current-generated
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit generated current runtimes only
        shell: bash
        run: |
          set -euo pipefail
          git add src/generated/offline-validate-source.js src/generated/offline-browser-source.js src/generated/offline-glyph-source.js
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(offline): refresh current compact runtime snapshots'
          git push origin HEAD:refs/heads/refactor/compact-gpt-task-package
