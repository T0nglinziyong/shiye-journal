name: Craft browser regression

on:
  pull_request:
    branches: [main, test]
    paths:
      - 'src/craft-*.js'
      - 'src/material-*.js'
      - 'src/creative*.js'
      - 'src/app.js'
      - 'src/backup-*.js'
      - 'src/store.js'
      - 'tests/backup-*.mjs'
      - 'src/offline*.js'
      - 'src/*cache*.js'
      - 'src/presentation-resources.js'
      - 'src/lazy-private-images.js'
      - 'src/library-selection-ui.js'
      - 'src/swift-popover.js'
      - 'src/selection-menu.css'
      - 'src/matching-session.js'
      - 'src/parity-ui.js'
      - 'tests/craft-*'
      - 'tests/presentation-*'
      - 'tests/swift-popover-*'
      - 'tests/browser-harness.mjs'
      - '.github/workflows/craft-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: craft-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install pinned browser test driver outside project dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/shiye-browser" --no-save --package-lock=false agent-browser@0.38.2
          BROWSER_BIN="$RUNNER_TEMP/shiye-browser/node_modules/.bin/agent-browser"
          "$BROWSER_BIN" install --with-deps
          "$BROWSER_BIN" --version
          echo "SHIYE_BROWSER_BIN=$BROWSER_BIN" >> "$GITHUB_ENV"
      - name: Build actual sources
        run: npm run build
      - name: Verify materials menus and warm page returns in four viewports
        shell: bash
        env:
          SHIYE_TEST_URL: http://127.0.0.1:5192
          SHIYE_CRAFT_SCREENSHOTS: /tmp/shiye-craft-browser
        run: |
          set -euo pipefail
          npm run dev -- --port 5192 --strictPort > /tmp/shiye-craft-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5192/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5192/ >/dev/null
          node tests/backup-archive-browser.mjs
          node tests/craft-browser.mjs
          node tests/presentation-browser.mjs
          node tests/craft-multimodal-browser.mjs
          git diff --exit-code -- package.json package-lock.json src/generated/offline-validate-source.js src/generated/offline-browser-source.js src/generated/offline-glyph-source.js
      - name: Retain synthetic screenshots and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: craft-browser-synthetic-${{ github.run_id }}
          path: /tmp/shiye-craft-browser/
          if-no-files-found: warn
          retention-days: 7
