name: Verify Shiye

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Unit tests and built UI smoke
        run: npm test && npm run test:ui
      - name: Package local box acceptance harness
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p /tmp/shiye-box-harness/scripts
          cp -R src /tmp/shiye-box-harness/
          cp scripts/box-real-case-runner.mjs scripts/segmentation-real-case-runner.mjs /tmp/shiye-box-harness/scripts/
          cp package.json package-lock.json /tmp/shiye-box-harness/
          mkdir -p /tmp/shiye-box-harness/node_modules/@techstark
          cp -R node_modules/@techstark/opencv-js /tmp/shiye-box-harness/node_modules/@techstark/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name == 'pull_request'
        with:
          name: box-segmentation-harness
          path: /tmp/shiye-box-harness/
          retention-days: 1
          compression-level: 6
