name: Interface browser regression

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - '.github/workflows/interface-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

# Repeated PR pushes must not leave stale browser runners consuming minutes.
# Preserve the regression gate; cancel superseded attempts, not checks.
concurrency:
  group: interface-browser-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install browser driver
        timeout-minutes: 12
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/shiye-browser" --no-save --package-lock=false agent-browser@0.38.2
          "$RUNNER_TEMP/shiye-browser/node_modules/.bin/agent-browser" install --with-deps
          echo "$RUNNER_TEMP/shiye-browser/node_modules/.bin" >> "$GITHUB_PATH"
      - run: npm run build
      - name: Check screens and editor in Chromium viewports
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --mode browser-test --port 5193 --strictPort > /tmp/shiye-interface-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5193/ >/dev/null; then break; fi
            sleep 1
          done
          SHIYE_TEST_URL=http://127.0.0.1:5193 node tests/fabric-editor-product-browser.mjs
          SHIYE_TEST_URL=http://127.0.0.1:5193 node tests/fabric-stage-browser.mjs
          SHIYE_TEST_URL=http://127.0.0.1:5193 node tests/import-browser-acceptance.mjs
          SHIYE_TEST_URL=http://127.0.0.1:5193 npm run test:editor-layout-browser
          SHIYE_TEST_URL=http://127.0.0.1:5193 node tests/cloud-cache-browser.mjs
          SHIYE_TEST_URL=http://127.0.0.1:5193 node tests/backup-archive-browser.mjs
          SHIYE_TEST_URL=http://127.0.0.1:5193 node tests/dialog-focus-browser.mjs
          SHIYE_TEST_URL=http://127.0.0.1:5193 node tests/navigation-history-browser.mjs
          SHIYE_TEST_URL=http://127.0.0.1:5193 node tests/settings-offline-browser.mjs
          SHIYE_TEST_URL=http://127.0.0.1:5193 npm run test:sync-browser
          SHIYE_TEST_URL=http://127.0.0.1:5193 npm run test:responsive-browser
          SHIYE_TEST_URL=http://127.0.0.1:5193 npm run test:selection-browser
          SHIYE_TEST_URL=http://127.0.0.1:5193 npm run test:layout-browser
      - name: Upload viewport screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: interface-browser-${{ github.run_id }}
          path: |
            /tmp/shiye-fabric-product/
            /tmp/shiye-fabric-stage.png
            /tmp/shiye-fabric-reference.png
            /tmp/shiye-import-browser/
            /tmp/shiye-editor-layout/
            /tmp/shiye-cache-browser/
            /tmp/shiye-responsive-review/
            /tmp/shiye-library-selection/
            /tmp/shiye-layout-preview/
          retention-days: 7
      - name: Archive private build source maps
        if: always() && github.event.repository.private
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-maps-${{ github.run_id }}
          path: .build-sourcemaps/
          retention-days: 7
