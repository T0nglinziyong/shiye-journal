name: Materialize verified library source
on:
  push:
    branches: [feat/library-taxonomy-covers-20261022]
    paths: [.github/workflows/library-materialize.yml]
permissions:
  contents: write
jobs:
  source:
    if: github.ref == 'refs/heads/feat/library-taxonomy-covers-20261022'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Verify tested source and publish code-only changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 2611ddee0d3dc5f03e1cc4a3b39c8a591e1f8d2f^{tree})" = 1c654891f85b60d1ef9f3542c51a2bb78a8062b3
          python3 - <<'PY'
          import base64,hashlib,json,lzma,pathlib,shutil
          parts=sorted(pathlib.Path('.library-transfer').glob('part-*.b64'))
          assert len(parts)==4
          payload=base64.b64decode(''.join(p.read_text() for p in parts),validate=True)
          assert hashlib.sha256(payload).hexdigest()=='173722489792f111f5916397447912a66c0799f9a765d2a70d7f82e9414b333d'
          changes=json.loads(lzma.decompress(payload))
          assert len(changes)==49
          for change in changes:
              path=pathlib.Path(change['path'])
              assert not path.is_absolute() and '..' not in path.parts and not path.is_symlink()
              if str(path).startswith('.github/'): continue
              assert str(path).startswith(('src/','tests/','docs/','creation-contract/'))
              old=path.read_text() if path.exists() else ''
              assert hashlib.sha256(old.encode()).hexdigest()==change['before'],str(path)
              new=old
              for start,end,text in reversed(change['edits']):
                  assert 0<=start<=end<=len(old)
                  new=new[:start]+text+new[end:]
              assert hashlib.sha256(new.encode()).hexdigest()==change['after'],str(path)
              if change['status']=='D':
                  assert new==''
                  path.unlink()
              else:
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_text(new)
          shutil.rmtree('.library-transfer')
          PY
          git add -A
          git diff --cached --check
          test -z "$(git diff --cached --name-only -- .github)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: clearer material taxonomy, responsive covers and artistic editor previews'
          git push origin HEAD:refs/heads/feat/library-taxonomy-covers-20261022
