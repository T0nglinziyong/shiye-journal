name: Material polish source snapshot
on:
  push:
    branches: [fix/material-previews-artistic-defaults-20261022]
    paths: [.github/workflows/material-polish-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive tracked source only
        run: |
          mkdir -p /tmp/shiye-source
          git rev-parse HEAD > /tmp/shiye-source/revision.txt
          git archive HEAD | gzip > /tmp/shiye-source/source.tar.gz
          cd /tmp/shiye-source && sha256sum source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: material-polish-source
          path: /tmp/shiye-source
          retention-days: 1
